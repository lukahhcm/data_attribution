experiment:
  method: iterative_vf
  seed: 1
  output_root: outputs
  resume: null
  run_name: null

dataset:
  name: cifar100
  root: ./data
  split_seed: 1
  noise_seed: 1
  noise_rate: 0.1

model:
  name: cifar_resnet18

selection:
  retention: 0.2
  rounds: 10
  omega_lr: 0.1
  alpha:
    scale: gradient_ratio
    min_multiplier: 0.1
    max_multiplier: 3.0
    schedule: linear
    ramp_fraction: 0.5

selector:
  epochs: 120
  batch_size: 128
  validation_batch_size: 128
  score_batch_size: 512
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
  scheduler:
    name: cosine
    eta_min: 0.0
    warmup_epochs: 5
    warmup_start_factor: 0.1

evaluator:
  epochs: 200
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
  scheduler:
    name: cosine
    eta_min: 0.0
    warmup_epochs: 5
    warmup_start_factor: 0.1

rho:
  reference_epochs: 100
  target_epochs: 150
  candidate_batch_size: 320
  selected_batch_size: 32
  selection_mode: train
  score_view: train
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01

runtime:
  workers: 4
  pin_memory: true
  amp: true
  cudnn_benchmark: true
  sync_batchnorm: false
