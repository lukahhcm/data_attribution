experiment:
  method: iterative_vf
  seed: 1
  output_root: outputs
  resume: null
  run_name: null

dataset:
  name: mnist
  root: ./data
  split_seed: 1
  noise_seed: 1
  noise_rate: 0.1

model:
  name: mnist_mlp
  hidden: 300

selection:
  retention: 0.2
  rounds: 10
  omega_lr: 0.1
  alpha:
    scale: fixed
    min: 0.01
    max: 0.1
    schedule: linear
    ramp_fraction: 0.5

selector:
  epochs: 50
  batch_size: 500
  validation_batch_size: 500
  score_batch_size: 1000
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.01
  scheduler:
    name: none

evaluator:
  epochs: 50
  batch_size: 256
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001
  scheduler:
    name: cosine
    eta_min: 0.0

rho:
  reference_epochs: 30
  target_epochs: 50
  candidate_batch_size: 320
  selected_batch_size: 32
  selection_mode: train
  score_view: train
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01

runtime:
  workers: 4
  pin_memory: true
  amp: true
  cudnn_benchmark: true
  sync_batchnorm: false
